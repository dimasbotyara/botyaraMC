name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            launcher/requirements.txt
            server/requirements.txt

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Tkinter & Xvfb for GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r launcher/requirements.txt -r server/requirements.txt pytest pytest-timeout "ruff>=0.6"

      - name: Syntax check (py_compile)
        run: python -m py_compile server/*.py launcher/*.py tests/*.py

      - name: Lint (ruff — syntax errors, pyflakes, undefined names)
        run: ruff check launcher server tests --select E9,F63,F7,F82

      - name: Run full test suite (Server + Sync + CLI + Crash Parser + UI)
        run: xvfb-run -a pytest -v --timeout=300

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.python-version }}-logs
          path: |
            ~/.config/botyaraMC/*.log
            /tmp/botyaramc-pytest-*
          if-no-files-found: ignore
          retention-days: 7

  test-cross-platform:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            launcher/requirements.txt
            server/requirements.txt

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r launcher/requirements.txt -r server/requirements.txt pytest pytest-timeout

      - name: Run test suite
        run: pytest -v --timeout=300

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.python-version }}-logs
          path: |
            ~/AppData/Roaming/botyaraMC/*.log
            ~/Library/Application Support/botyaraMC/*.log
            ~/.config/botyaraMC/*.log
          if-no-files-found: ignore
          retention-days: 7
