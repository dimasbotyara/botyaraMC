name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: launcher/requirements.txt

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Tkinter & Xvfb for GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r launcher/requirements.txt -r server/requirements.txt pytest

      - name: Syntax check (py_compile)
        run: python -m py_compile server/*.py launcher/*.py tests/*.py

      - name: Run full test suite (Server + Sync + CLI + Crash Parser + UI)
        run: xvfb-run -a pytest -v

  test-cross-platform:
    name: ${{ matrix.os }} (Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: launcher/requirements.txt

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r launcher/requirements.txt -r server/requirements.txt pytest

      - name: Run test suite
        run: pytest -v
